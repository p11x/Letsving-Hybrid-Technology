<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FE0" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
    <radialGradient id="pwaBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1E38" />
      <stop offset="60%" stop-color="#0A1428" />
      <stop offset="100%" stop-color="#050B18" />
    </radialGradient>
    <filter id="pwaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#38BDF8" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#pwaBg)" />
  <rect width="512" height="512" rx="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />
  
  <g transform="translate(64, 56)" filter="url(#pwaGlow)">
    <!-- Circuit lines -->
    <path d="M 100 80 L 100 290 L 220 290" fill="none" stroke="url(#pwaGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 284 110 L 284 320" fill="none" stroke="url(#pwaGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 100 200 L 284 200" fill="none" stroke="url(#pwaGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 220 290 L 284 200" fill="none" stroke="#38BDF8" stroke-width="20" stroke-dasharray="12 16" stroke-linecap="round" opacity="0.8" />
    
    <!-- 3 Glowing Network Node Dots -->
    <circle cx="100" cy="80" r="22" fill="#38BDF8" />
    <circle cx="100" cy="80" r="9" fill="#FFFFFF" />
    
    <circle cx="192" cy="200" r="19" fill="#8B7CFF" />
    <circle cx="192" cy="200" r="8" fill="#FFFFFF" />
    
    <circle cx="284" cy="320" r="22" fill="#1E6FE0" />
    <circle cx="284" cy="320" r="9" fill="#FFFFFF" />
  </g>
</svg>
