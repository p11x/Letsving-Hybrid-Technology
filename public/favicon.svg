<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FE0" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A1428" />
  <g filter="url(#favGlow)" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 'L' Vector stem & baseline -->
    <path d="M 18 14 L 18 46 L 36 46" />
    <!-- 'H' Interlocking Right Pillar & Cross-Conduit -->
    <path d="M 46 18 L 46 50" />
    <path d="M 18 32 L 46 32" />
    <!-- Diagonal Hybrid Bridge -->
    <path d="M 36 46 L 46 32" stroke-dasharray="2 3" opacity="0.85" />
  </g>
  <!-- 3 Data / Network Node Dots -->
  <circle cx="18" cy="14" r="3.5" fill="#38BDF8" />
  <circle cx="32" cy="32" r="3" fill="#8B7CFF" />
  <circle cx="46" cy="50" r="3.5" fill="#1E6FE0" />
</svg>
