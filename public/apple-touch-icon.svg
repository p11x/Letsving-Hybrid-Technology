<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FE0" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
    <radialGradient id="appleAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E6FE0" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0A1428" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050B18" />
    </radialGradient>
    <filter id="appleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="180" height="180" rx="38" fill="url(#appleAura)" />
  <rect width="180" height="180" rx="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <g transform="translate(18, 18)" filter="url(#appleGlow)">
    <!-- Circuit lines -->
    <path d="M 40 32 L 40 108 L 82 108" fill="none" stroke="url(#appleGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 104 42 L 104 118" fill="none" stroke="url(#appleGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 40 75 L 104 75" fill="none" stroke="url(#appleGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 82 108 L 104 75" fill="none" stroke="#38BDF8" stroke-width="7" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.8" />
    
    <!-- Nodes -->
    <circle cx="40" cy="32" r="8" fill="#38BDF8" />
    <circle cx="40" cy="32" r="3.5" fill="#FFFFFF" />
    
    <circle cx="72" cy="75" r="7" fill="#8B7CFF" />
    <circle cx="72" cy="75" r="3" fill="#FFFFFF" />
    
    <circle cx="104" cy="118" r="8" fill="#1E6FE0" />
    <circle cx="104" cy="118" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
