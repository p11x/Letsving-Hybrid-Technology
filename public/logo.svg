<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="logoSvgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FE0" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
    <radialGradient id="logoSvgAura" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E6FE0" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0F1E38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A1428" />
    </radialGradient>
    <filter id="logoSvgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="25" y="25" width="550" height="550" rx="90" fill="url(#logoSvgAura)" stroke="rgba(255,255,255,0.08)" stroke-width="2" filter="url(#logoSvgShadow)" />

  <!-- Monogram Mark -->
  <g transform="translate(145, 70)">
    <!-- Circuit lines for L and H -->
    <path d="M 60 40 L 60 210 L 160 210" fill="none" stroke="url(#logoSvgGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 240 65 L 240 235" fill="none" stroke="url(#logoSvgGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 60 145 L 240 145" fill="none" stroke="url(#logoSvgGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 160 210 L 240 145" fill="none" stroke="#38BDF8" stroke-width="16" stroke-dasharray="10 14" opacity="0.85" stroke-linecap="round" />

    <!-- 3 Node Dots -->
    <circle cx="60" cy="40" r="18" fill="#38BDF8" />
    <circle cx="60" cy="40" r="7" fill="#FFFFFF" />

    <circle cx="150" cy="145" r="16" fill="#8B7CFF" />
    <circle cx="150" cy="145" r="6" fill="#FFFFFF" />

    <circle cx="240" cy="235" r="18" fill="#1E6FE0" />
    <circle cx="240" cy="235" r="7" fill="#FFFFFF" />
  </g>

  <!-- Wordmark Section -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', BlinkMacSystemFont, sans-serif">
    <!-- LETSVING HYBRID -->
    <text x="300" y="420" font-weight="900" font-size="42" letter-spacing="1">
      <tspan fill="#FFFFFF">LETSVING </tspan>
      <tspan fill="url(#logoSvgGrad)">HYBRID</tspan>
    </text>

    <!-- TECHNOLOGY -->
    <text x="300" y="460" font-weight="700" font-size="16" letter-spacing="10" fill="#38BDF8" font-family="monospace">
      TECHNOLOGY
    </text>

    <text x="300" y="495" font-weight="600" font-size="11" letter-spacing="6" fill="rgba(255,255,255,0.4)">
      PRIVATE LIMITED
    </text>

    <text x="300" y="525" font-weight="700" font-size="10" letter-spacing="4" fill="rgba(255,255,255,0.6)">
      <tspan fill="#8B7CFF">AI</tspan>
      <tspan fill="#38BDF8">  ●  </tspan>
      <tspan fill="#8B7CFF">HYBRID CLOUD</tspan>
      <tspan fill="#38BDF8">  ●  </tspan>
      <tspan fill="#8B7CFF">INNOVATION</tspan>
    </text>
  </g>
</svg>
